name: Frontend - Azure Static Web Apps

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-swa.yml']
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publicar en Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist/data-health-frontend/browser
          api_location: ''
          skip_app_build: true
          skip_api_build: true