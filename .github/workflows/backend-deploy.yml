name: Deploy Backend to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Docker Image and Deploy
        uses: Azure/cli@v1
        with:
          inlineScript: |
            az containerapp up \
              --name ca-datahealth-api \
              --resource-group rg-datahealth-stg \
              --source ./backend \
              --environment cae-datahealth-stg \
              --ingress external \
              --target-port 8080 \
              --build-env-vars BP_JVM_VERSION=21