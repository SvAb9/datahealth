name: Deploy Backend to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App using ACR
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: '${{ github.workspace }}/backend'
          acrName: 'acrdatahealth8659'
          resourceGroup: 'rg-datahealth-stg'
          containerAppName: 'ca-datahealth-api'