# Perfil "docker": dentro del contenedor, localhost es el propio contenedor.
# host.docker.internal apunta al Oracle que corre en tu computadora (el mismo que ves en SQL Developer).
# Se puede reemplazar sin reconstruir la imagen con la variable de entorno DB_URL (útil para la nube).
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//host.docker.internal:1521/XEPDB1}
