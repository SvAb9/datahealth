# Perfil "azure": staging en Azure Container Apps + Oracle Autonomous Database.
# Todo llega por variables de entorno (ADR-10); aquí no hay secretos.
spring.datasource.url=${DB_URL}

# Autonomous Database Always Free admite pocas sesiones: pool pequeño
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

app.cors.allowed-origin=${CORS_ORIGIN}

# Solo /actuator/health (ADR-12)
management.endpoints.web.exposure.include=health
